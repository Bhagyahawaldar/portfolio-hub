<section id="contact">
    <div class="section-container">
        <h2>Contact Me</h2>
        <p class="section-description">
            Have a question, project idea or opportunity?
            Feel free to send me a message.
        </p>
        <div class="contact-container">
            <div class="contact-info">
                <h3>Let's Connect</h3>
                <p>
                    I am interested in software development,
                    full-stack development and new opportunities.
                </p>
                <p>
                    📧 Email:
                    bhagyashree@example.com
                </p>
                <p>
                    💻 GitHub:
                    <a
                        href="https://github.com/"
                        target="_blank"
                    >
                        View GitHub
                    </a>
                </p>
                <p>
                    🔗 LinkedIn:
                    <a
                        href="https://www.linkedin.com/"
                        target="_blank"
                    >
                        View LinkedIn
                    </a>
                </p>
            </div>
            <form id="contact-form">
                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                    required
                >
                <input
                    type="email"
                    id="email"
                    placeholder="Your Email"
                    required
                >
                <textarea
                    id="message"
                    placeholder="Your Message"
                    required
                ></textarea>
                <button type="submit">
                    Send Message
                </button>
                <p id="contact-status"></p>
            </form>
        </div>
    </div>
</section>
